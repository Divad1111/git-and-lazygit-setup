# Portable snapshot. Values are literal text after the first =, not shell code.
user.name=zhangwei
user.email=zhangwei@qixia.com
core.autocrlf=false
init.defaultBranch=main
fetch.prune=true
pull.ff=only
diff.algorithm=histogram
color.ui=auto
merge.conflictStyle=diff3
rerere.enabled=true
difftool.prompt=false
mergetool.bc.trustExitCode=false
mergetool.keepBackup=true
safe.directory=*
alias.st=status -sb
alias.hist=log --graph --oneline --decorate --all -30
alias.last=log -1 --stat
alias.ds=diff --staged
alias.dc=diff --check
alias.unstage=restore --staged
alias.branches=branch -vv
alias.ui=!lazygit
alias.mt=mergetool --tool=bc
